name: Build and Deploy

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: self-hosted  # <== Dòng quan trọng
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Deploy to local server
        run: ./deploy.sh  # hoặc script bạn dùng
